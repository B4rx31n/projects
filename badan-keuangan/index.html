<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Anime Catalog — Jack</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Roboto+Condensed&display=swap');
    body { font-family: 'Roboto Condensed', sans-serif; background:#0a0a0a; color:#fff; }
    .font-orbitron{font-family:'Orbitron',sans-serif;}
    .card-img{height:320px; width:100%; object-fit:cover; display:block;}
    .scrollbar-hide::-webkit-scrollbar{display:none;}
    .scrollbar-hide{ -ms-overflow-style:none; scrollbar-width:none; }
  </style>
</head>
<body class="relative">
  <div class="w-full h-2 bg-[#ff9f00] fixed top-0 left-0 z-50"></div>

  <div class="max-w-[1280px] mx-auto px-4 pt-8 pb-16 relative z-40">
    <header class="flex items-center justify-between mb-6 select-none">
      <div class="flex items-center space-x-6">
        <div class="text-[#ff9f00] font-orbitron text-2xl" style="letter-spacing:0.12em">ANIME</div>
        <nav class="hidden sm:flex space-x-5 text-sm">
          <a class="hover:text-[#ff9f00]" href="#">SERIES</a>
          <a class="hover:text-[#ff9f00]" href="#">NEW</a>
          <a class="hover:text-[#ff9f00]" href="#">POPULAR</a>
          <a class="hover:text-[#ff9f00]" href="#">BLOG</a>
        </nav>
      </div>

      <div class="flex items-center space-x-3">
        <div class="relative text-gray-300">
          <input id="search" class="bg-[#1a1a1a] rounded-md pl-3 pr-8 py-1 text-sm placeholder:text-gray-500 focus:outline-none" placeholder="SEARCH MOVIE..." type="text"/>
          <button id="search-btn" class="absolute right-1 top-1 text-gray-400 hover:text-[#ff9f00]">
            <i class="fas fa-search"></i>
          </button>
        </div>
        <button id="filter-era" class="hidden sm:inline-block px-3 py-1 border border-gray-700 rounded text-sm">Filter Era</button>
      </div>
    </header>

    <!-- HERO -->
    <section class="relative rounded-lg overflow-hidden mb-10" style="background:linear-gradient(90deg, rgba(10,10,10,0.9) 40%, transparent 100%);">
      <img alt="hero" src="https://via.placeholder.com/1280x400?text=Anime+Hero" class="w-full h-[300px] object-cover absolute top-0 left-0 -z-10 opacity-60"/>
      <div class="max-w-[640px] p-6 sm:p-10">
        <img alt="logo" src="https://via.placeholder.com/320x80?text=Anime+Catalog" class="mb-3"/>
        <p class="text-gray-300 mb-4">Katalog anime lengkap — dari masa klasik sampai rilis terbaru. Klik <span class="text-[#ff9f00]">WATCH NOW</span> untuk membuka link streaming setiap judul.</p>
        <div class="flex space-x-3">
          <button id="btn-random" class="text-[#ff9f00] border border-[#ff9f00] rounded px-3 py-1 text-sm hover:bg-[#ff9f00] hover:text-black transition">WATCH RANDOM</button>
          <button id="btn-reset" class="bg-[#1a1a1a] border border-gray-600 rounded px-3 py-1 text-sm hover:bg-[#ff9f00] hover:text-black transition">RESET FILTER</button>
        </div>
      </div>
    </section>

    <h2 class="text-lg sm:text-xl font-semibold mb-4">Anime Catalog</h2>

    <!-- Grid -->
    <div id="anime-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <!-- Cards injected by script.js -->
    </div>

    <!-- Pagination / load more -->
    <div class="mt-8 flex justify-center">
      <button id="load-more" class="px-4 py-2 border border-gray-700 rounded text-sm hover:bg-[#ff9f00] hover:text-black transition">Load more</button>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
