<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Daftar Game Terbaru</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #f5f5f5;
      padding-bottom: 70px;
    }

    header {
      background: linear-gradient(90deg, #4776e6, #8e54e9);
      color: white;
      padding: 20px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
    }

    header h1 {
      margin: 0;
      font-size: 20px;
    }

    .menu-btn {
      font-size: 20px;
      cursor: pointer;
    }

    .dropdown {
      position: absolute;
      top: 60px;
      right: 16px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      display: none;
      z-index: 1000;
      min-width: 160px;
      animation: fadeIn 0.3s ease-in-out;
    }

    .dropdown a {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 20px;
      text-decoration: none;
      font-size: 14px;
      color: #2575FC;
      font-weight: bold;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.3s ease;
    }

    .dropdown a:last-child {
      border-bottom: none;
    }

    .dropdown a:hover {
      background: rgba(255, 255, 255, 0.1);
      padding-left: 28px;
      color: #ffffff;
    }

    .dropdown a i {
      width: 18px;
      text-align: center;
    }

    .search-container {
      position: relative;
      padding: 16px;
    }

    .search-container input {
      width: 100%;
      padding: 10px 44px 10px 16px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      box-sizing: border-box;
      color: #2575FC;
    }

    .search-container input::placeholder {
      color: #2575FC;
    }

    .search-container .fa-search {
      position: absolute;
      right: 28px;
      top: 50%;
      transform: translateY(-50%);
      color: #2575FC;
      pointer-events: none;
    }

    #game-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      padding: 16px;
    }

    .card {
      border-radius: 12px;
      padding: 16px;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: transform 0.2s;
      animation: fadeScale 0.4s ease;
    }

    .card:hover {
      transform: scale(1.02);
    }

    .card .info {
      max-width: 70%;
    }

    .card h2 {
      margin: 0 0 8px;
      font-size: 18px;
    }

    .card .genre {
      opacity: 0.9;
    }

    .card .rating {
      display: flex;
      align-items: center;
      margin-top: 8px;
    }

    .card .price-platform {
      text-align: right;
    }

    .star {
      color: gold;
      margin-right: 4px;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      backdrop-filter: blur(5px);
      justify-content: center;
      align-items: center;
      z-index: 999;
      animation: fadeIn 0.3s ease;
    }

    .modal-content {
      padding: 24px;
      border-radius: 16px;
      color: white;
      width: 90%;
      max-width: 400px;
      position: relative;
      animation: scaleIn 0.3s ease;
    }

    .modal-content h2 {
      margin-top: 0;
    }

    .close-btn {
      position: absolute;
      top: 12px;
      right: 16px;
      font-size: 20px;
      cursor: pointer;
      color: white;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      height: 70px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: linear-gradient(90deg, #6A11CB, #2575FC);
      border-top-left-radius: 16px;
      border-top-right-radius: 16px;
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: rgba(255,255,255,0.7);
      font-size: 12px;
      text-decoration: none;
      padding: 8px;
      transition: all 0.3s ease;
    }

    .nav-item.active {
      color: white;
      font-weight: bold;
    }

    .nav-item.active .icon-container {
      background-color: rgba(255,255,255,0.2);
      border-radius: 50%;
      padding: 8px;
    }

    .nav-item i {
      font-size: 20px;
    }

    .icon-container {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    @keyframes fadeIn {
      from { opacity: 0 }
      to { opacity: 1 }
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.85);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes fadeScale {
      from {
        opacity: 0;
        transform: scale(0.9);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Daftar Game Terbaru</h1>
    <div class="menu-btn" onclick="toggleDropdown()"><i class="fas fa-ellipsis-v"></i></div>
    <div class="dropdown" id="dropdown-menu">
      <a href="#"><i class="fas fa-user"></i> About Me</a>
      <a href="#"><i class="fas fa-cog"></i> Pengaturan</a>
      <a href="#"><i class="fas fa-question-circle"></i> Bantuan</a>
    </div>
  </header>

  <div class="search-container">
    <input type="text" id="search-input" placeholder="Cari game...">
    <i class="fas fa-search"></i>
  </div>

  <main id="game-list"></main>

  <div class="modal" id="detail-modal">
    <div class="modal-content" id="modal-content">
      <span class="close-btn" onclick="closeModal('detail-modal')">&times;</span>
      <h2 id="modal-title"></h2>
      <p><strong>Genre:</strong> <span id="modal-genre"></span></p>
      <p><strong>Harga:</strong> <span id="modal-price"></span></p>
      <p><strong>Rating:</strong> <span id="modal-rating"></span></p>
      <p><strong>Platform:</strong> <span id="modal-platform"></span></p>
    </div>
  </div>

  <div class="bottom-nav">
    <a href="home.html" class="nav-item active" id="nav-home">
      <div class="icon-container"><i class="fas fa-home"></i></div>
      <span>Home</span>
    </a>
    <a href="riwayat.html" class="nav-item" id="nav-riwayat">
      <div class="icon-container"><i class="fas fa-shopping-cart"></i></div>
      <span>Riwayat</span>
    </a>
    <a href="profile.html" class="nav-item" id="nav-profile">
      <div class="icon-container"><i class="fas fa-user"></i></div>
      <span>Profil</span>
    </a>
  </div>

  <script>
    const gameListData = [
      { title: "God of War: Ragnarok", genre: "Action", price: "Rp 800.000", rating: 4.8, platform: "PS5" },
      { title: "FIFA 23", genre: "Sports", price: "Rp 750.000", rating: 4.5, platform: "Multi Platform" },
      { title: "The Sims 4", genre: "Simulation", price: "Rp 400.000", rating: 4.2, platform: "PC" },
      { title: "Minecraft Legends", genre: "Sandbox", price: "Rp 350.000", rating: 4.7, platform: "Multi Platform" },
      { title: "Elden Ring", genre: "RPG", price: "Rp 850.000", rating: 4.9, platform: "Multi Platform" },
      { title: "Resident Evil 4 Remake", genre: "Horror", price: "Rp 800.000", rating: 4.8, platform: "Multi Platform" },
      { title: "Forza Horizon 5", genre: "Racing", price: "Rp 700.000", rating: 4.6, platform: "Xbox/PC" },
      { title: "GTA V", genre: "Open World", price: "Rp 500.000", rating: 4.7, platform: "Multi Platform" },
      { title: "Hogwarts Legacy", genre: "Fantasy", price: "Rp 780.000", rating: 4.5, platform: "Multi Platform" },
      { title: "Starfield", genre: "RPG", price: "Rp 900.000", rating: 4.3, platform: "Xbox/PC" },
      { title: "Spider-Man 2", genre: "Action", price: "Rp 850.000", rating: 4.9, platform: "PS5" },
      { title: "Cyberpunk 2077", genre: "RPG", price: "Rp 600.000", rating: 4.4, platform: "Multi Platform" }
    ];

    const genreColors = {
      "Action": ["#6A11CB", "#2575FC"],
      "RPG": ["#11998E", "#38EF7D"],
      "Sports": ["#FDC830", "#F37335"],
      "Horror": ["#870000", "#190A05"]
    };

    const container = document.getElementById("game-list");
    const searchInput = document.getElementById("search-input");

    function renderGames(list) {
      container.innerHTML = "";
      list.forEach(game => {
        const card = document.createElement("div");
        card.className = "card";

        const gradient = genreColors[game.genre] || ["#4776E6", "#8E54E9"];
        card.style.background = `linear-gradient(90deg, ${gradient[0]}, ${gradient[1]})`;

        card.innerHTML = `
          <div class="info">
            <h2>${game.title}</h2>
            <div class="genre">${game.genre}</div>
            <div class="rating"><span class="star">★</span>${game.rating}</div>
          </div>
          <div class="price-platform">
            <div><strong>${game.price}</strong></div>
            <div style="opacity: 0.8;">${game.platform}</div>
          </div>
        `;

        card.onclick = () => showModal(game, gradient);
        container.appendChild(card);
      });
    }

    function showModal(game, gradient) {
      document.getElementById("modal-title").textContent = game.title;
      document.getElementById("modal-genre").textContent = game.genre;
      document.getElementById("modal-price").textContent = game.price;
      document.getElementById("modal-rating").textContent = game.rating;
      document.getElementById("modal-platform").textContent = game.platform;

      const modal = document.getElementById("detail-modal");
      const modalContent = document.getElementById("modal-content");
      modalContent.style.background = `linear-gradient(90deg, ${gradient[0]}, ${gradient[1]})`;
      modal.style.display = "flex";
    }

    function closeModal(id) {
      document.getElementById(id).style.display = "none";
    }

    function toggleDropdown() {
      const menu = document.getElementById("dropdown-menu");
      menu.style.display = (menu.style.display === "block") ? "none" : "block";
    }

    searchInput.addEventListener("input", function () {
      const keyword = this.value.toLowerCase();
      const filtered = gameListData.filter(game =>
        game.title.toLowerCase().includes(keyword) ||
        game.genre.toLowerCase().includes(keyword)
      );
      renderGames(filtered);
    });

    window.onclick = function(event) {
      if (!event.target.closest('.menu-btn')) {
        document.getElementById("dropdown-menu").style.display = "none";
      }
      const modals = ["detail-modal"];
      modals.forEach(id => {
        const modal = document.getElementById(id);
        if (event.target === modal) {
          modal.style.display = "none";
        }
      });
    };

    renderGames(gameListData);
  </script>
</body>
</html>
